# One-shot: `docker compose run --rm morning-post` делает один пост и
# выходит. Никакого `docker compose up` — сервис не демон, restart: "no".
services:
  morning-post:
    image: ghcr.io/onixfireone/morning-post:latest
    build: .
    restart: "no"
    env_file:
      - .env
    volumes:
      # STATE_FILE в .env — ./data/state.json, тот же путь и внутри контейнера
      # (WORKDIR /app) — история переживает пересоздание контейнера.
      - ./data:/app/data
      # v2: OUT_DIR в .env — ./out, тот же путь внутри контейнера. Без этого
      # тома ai.json/usage.jsonl умирают вместе с контейнером на VPS.
      - ./out:/app/out
